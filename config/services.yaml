services:
    _defaults:
        autowire: true
        autoconfigure: true
        public: false

    MonsieurBiz\SyliusScriptsPlugin\:
        resource: '../src/*'
        exclude: '../src/{Entity,Migrations}'

    MonsieurBiz\SyliusScriptsPlugin\Controller\:
        resource: '../../Controller'
        tags: [ 'controller.service_arguments' ]
